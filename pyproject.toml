[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meru-geometry-audit"
version = "0.5.0"
description = "A reproducible mathematical audit of Stan Tenen's Meru Foundation geometry."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Salah-Eddin Gherbi"}
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "shapely",
    "trimesh",
    "pyvista",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
